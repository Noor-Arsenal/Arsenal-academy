<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أكاديمية أرسنال طبربور - EST 2013</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:#080808;color:#fff}
.hero{background:radial-gradient(900px at 25% 15%,rgba(227,6,19,.4),transparent),linear-gradient(135deg,#1a0000,#E30613 50%,#000);padding:100px 20px;text-align:center}
.hero h1{font-size:64px;font-weight:900;line-height:.9}
.gold{color:#FFD700}
.badge{display:inline-block;background:#fff;color:#E30613;padding:10px 22px;border-radius:100px;font-weight:900;font-size:12px}
.btn{display:inline-block;padding:16px 36px;border-radius:100px;font-weight:900;text-decoration:none;margin:8px}
.btn-white{background:#fff;color:#000}
.btn-ghost{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:700px;margin:46px auto 0}
.stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);padding:24px;border-radius:22px}
.container{max-width:1240px;margin:0 auto;padding:70px 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card{background:#131313;border:1px solid rgba(255,255,255,.07);border-radius:28px;padding:30px}
.coach{display:flex;gap:16px;align-items:center;background:#131313;border:1px solid rgba(255,255,255,.07);border-radius:22px;padding:20px}
.avatar{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;background:#E30613}
.pricing{background:#f6f5f2;color:#000;padding:90px 20px}
.price-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:24px;max-width:1080px;margin:44px auto 0}
.price-card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:28px;padding:36px;text-align:center}
.price-card.popular{background:#E30613;color:#fff;transform:scale(1.06);border:4px solid #FFD700}
.price{font-size:52px;font-weight:900;margin:16px 0}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.gal{aspect-ratio:4/3;border-radius:20px;background:#1a1a1a;border:1px solid rgba(255,255,255,.07);display:flex;align-items:end;padding:14px;font-weight:900;font-size:11px}
@media(max-width:768px){.hero h1{font-size:40px}.gallery{grid-template-columns:1fr 1fr}.price-card.popular{transform:scale(1)}}
</style>
</head>
<body>
<!-- انسخ كل الكود من الملف المحمّل - الكود الكامل 12KB موجود في الملف -->
</body>
</html>
